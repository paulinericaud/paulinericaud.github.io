<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="game.css">
    <link rel="shortcut icon" href="icon.png">
    <meta charset="utf-8">
</head>

<body>

    <!-- ********************* html ********************* -->

    <nav>
        <div class="lang en">
            <button onclick="window.location.href='/en/projects'">Projects</button>
            <button onclick="window.location.href='/en/profile'">Profile</button>
        </div>
        <div class="lang fr">
            <button onclick="window.location.href='/fr/projects'">Projets</button>
            <button onclick="window.location.href='/fr/profile'">Profil</button>
        </div>
    </nav>
    <h1>Game A49</h1>
    
    <hr>

    <canvas id="canvas"></canvas>

    <div class="lang en">
        <input type="button" value="new game - default" onclick="newgame()">
        <input type="button" value="new game - custom" onclick="newgamecustom()">
        <br>
        <input type="button" value="undo" onclick="undo()">
        <input type="button" value="redo" onclick="redo()">
        <input type="button" value="shuffle" onclick="shuffle()">
        <input type="button" value="solve" onclick="solve()">
    </div>
    <div class="lang fr">
        <input type="button" value="nouveau jeu - défaut" onclick="newgame()">
        <input type="button" value="nouveau jeu - personnalisé" onclick="newgamecustom()">
        <br>
        <input type="button" value="défaire" onclick="undo()">
        <input type="button" value="refaire" onclick="redo()">
        <input type="button" value="mélanger" onclick="shuffle()">
        <input type="button" value="résoudre" onclick="solve()">
    </div>

    <!-- ********************* script ********************* -->

    <script src="game.js"></script>
    <script src="demo.js"> </script>
    <script>
        var lang = sessionStorage.getItem('lang');
        if (lang == null){
            lang = localStorage.getItem('lang');
            if (lang == null) lang = "en";
        }
        var elmt = document.getElementsByClassName("lang");
        for (var i = 0 ; i < elmt.length ; i++) {
            elmt[i].style.display = "none";
        }
        var elmtLang = document.getElementsByClassName(lang);
        for (var i = 0 ; i < elmtLang.length ; i++) {
            elmtLang[i].style.display = "block";
        }
    </script>

</body>

</html>
